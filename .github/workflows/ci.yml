name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm bug #4828: lockfiles can lose platform-specific optional deps
      # (rollup/esbuild/unrs-resolver natives), breaking vitest and eslint
      # on runners. Probe the known natives; if ANY is missing the lock is
      # incomplete — rebuild the whole tree from the registry, which restores
      # every native (not just the probed ones).
      - name: Heal platform-native optional deps
        run: |
          node -e "require('@rollup/rollup-linux-x64-gnu'); require('@esbuild/linux-x64'); require('@unrs/resolver-binding-linux-x64-gnu')" 2>/dev/null \
            && echo "✓ native bindings present" \
            || (echo "⚠ incomplete lockfile (npm#4828) — rebuilding node_modules" \
                && rm -rf node_modules package-lock.json \
                && npm install --no-audit --no-fund)

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify CLI executable
        run: |
          node bin/nexus.js --version
          node bin/nexus.js --help

  commitlint:
    name: Commit Message Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install commitlint
        run: npm install -g @commitlint/cli @commitlint/config-conventional

      - name: Validate PR commits
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  release-check:
    name: Release Surface
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # measureCommands() asks the built CLI what commands it has, rather
      # than guessing from the source, so dist/ has to exist.
      - name: Build
        run: npm run build

      # Every count we advertise — tests, commands, MCP tools, doctor checks —
      # measured against the code and compared to the README and the site.
      # Site files are not in this repo, so those checks skip here; the same
      # command run from the monorepo covers them before a deploy.
      - name: Check the release surface
        run: npm run release:check

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [quality, release-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Compare against the npm REGISTRY, not HEAD~1. This means a publish
      # that failed mid-run (e.g. expired NPM_TOKEN, 2026-06-09) can be
      # retried by simply re-running the workflow — the gate only skips
      # when the version is actually live on npm.
      - name: Check if version needs publishing
        id: version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view "$(node -p "require('./package.json').name")@$CURRENT" version 2>/dev/null || echo "")
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          if [ "$PUBLISHED" != "$CURRENT" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "📦 v$CURRENT is not on npm — publishing"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "⏭️ v$CURRENT already on npm — skipping publish"
          fi

      - name: Setup Node.js
        if: steps.version.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        if: steps.version.outputs.changed == 'true'
        run: npm ci

      - name: Build
        if: steps.version.outputs.changed == 'true'
        run: npm run build

      - name: Publish to npm
        if: steps.version.outputs.changed == 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create git tag
        if: steps.version.outputs.changed == 'true'
        run: |
          VERSION=${{ steps.version.outputs.current }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: steps.version.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.current }}
          name: v${{ steps.version.outputs.current }}
          body: |
            ## @nexus-framework/cli v${{ steps.version.outputs.current }}

            Install or update:
            ```bash
            npx @nexus-framework/cli@latest init my-app
            ```

            📦 [npm](https://www.npmjs.com/package/@nexus-framework/cli/v/${{ steps.version.outputs.current }})
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
